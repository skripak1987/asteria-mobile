name: Build Asteria Mobile APK
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev cmake libffi-dev libssl-dev build-essential ccache
      - name: Install buildozer
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython virtualenv
      - name: Build APK
        run: buildozer -v android debug > build.log 2>&1
      - name: Show errors
        if: failure()
        run: |
          echo "=== ERROR LINES ==="
          grep -n -i -E "error|fatal|failed|traceback|no matching|not found" build.log | tail -40
          echo "=== LAST 60 LINES ==="
          tail -60 build.log
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asteria-mobile-apk
          path: bin/*.apk
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
